[workspace]
resolver = "3"
members = ["crates/astralis-core", "apps/desktop/src-tauri", "crates/astralis-net", "crates/astralis-cloud", "crates/astralis-mcp"]
# The desktop app needs webkit2gtk on Linux; plain `cargo test` only builds the core.
default-members = ["crates/astralis-core", "crates/astralis-net", "crates/astralis-cloud", "crates/astralis-mcp"]

[profile.dev.package."*"]
# Dependencies (candle, harper, sqlite) are much faster optimized, even in dev builds.
opt-level = 2
# No debug info for dependencies: it made the dev binary over 1 GB and linking it took several GB
# of memory.
debug = false
