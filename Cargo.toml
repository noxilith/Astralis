[workspace]
resolver = "3"
members = ["crates/astralis-core", "apps/desktop/src-tauri"]
# The desktop app needs webkit2gtk on Linux; plain `cargo test` only builds the core.
default-members = ["crates/astralis-core"]

[profile.dev.package."*"]
# Dependencies (candle, harper, sqlite) are much faster optimized, even in dev builds.
opt-level = 2
