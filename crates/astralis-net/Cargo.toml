[package]
name = "astralis-net"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
astralis-core = { version = "0.1.0", path = "../astralis-core", default-features = false }
iroh = "1.4.1"
iroh-mdns-address-lookup = "0.6.1"
n0-future = "0.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
uuid = "1.29.1"

[dev-dependencies]
tracing-subscriber = "0.3.23"
