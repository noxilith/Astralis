[package]
name = "astralis-core"
version = "0.1.0"
license = "GPL-3.0-or-later"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
candle-core = { version = "0.11.1", optional = true }
candle-nn = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
getrandom = "0.4.3"
harper-core = "3.0.0"
rusqlite = { version = "0.41.1", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
uuid = { version = "1.29.1", features = ["serde", "v7"] }
yrs = "0.28.1"
zeroize = "1.9.1"

# The "Ask Astralis" model runner, on the graphics chip: Vulkan (Intel, AMD, NVIDIA) on Linux and
# Windows, Metal on macOS.
[target.'cfg(not(target_os = "macos"))'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
llama-cpp-2 = { version = "0.1.161", optional = true, features = ["metal"] }

[features]
default = ["ml"]
# The in-app models: embeddings (candle) and the "Ask Astralis" writer (llama.cpp). Without it
# the Brain uses a built-in lexical embedder and Ask Astralis is unavailable.
ml = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:llama-cpp-2"]
